# Tooling configuration for the training app.
#
# The app ships and runs as a self-contained folder via `python src/main.py`;
# `src/` is the import root.  Run tests with `pytest` from this folder.

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true
check_untyped_defs = true
disable_error_code = ["annotation-unchecked"]

[[tool.mypy.overrides]]
module = "PySide6.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "cv2.*", "tifffile.*", "skimage.*", "matplotlib.*",
    "instanseg.*", "torch.*", "PIL.*", "fastremap.*",
]
ignore_missing_imports = true
